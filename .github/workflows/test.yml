name: CI/CD Pipeline

on: [push]

jobs:
  # 仕事1: テスト (さっき作ったもの)
  test:
    name: Run Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Test
        run: go test -v ./...

  # 仕事2: デプロイ (ここが追加！)
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # 重要: testの仕事が成功しないと、この仕事はしない
    needs: test
    # 重要: mainブランチの時だけ実行する (実験用ブランチではやらない)
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Call Render Deploy Hook
        # さっき金庫に入れたURLを呼び出す
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"